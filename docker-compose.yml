services:
  mongo:
    image: mongo:7
    container_name: tachfen-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tachfen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tachfen-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5001
      MONGODB_CONNECTIONSTRING: mongodb://mongo:27017/tachfen
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: demo-access-token-secret-change-me
      CLIENT_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      PUBLIC_ORIGIN: http://localhost:8080
      PUBLIC_API_URL: http://localhost:8080/api
      PUBLIC_SOCKET_URL: http://localhost:8080
      MAX_UPLOAD_FILE_SIZE_MB: 10
      WEBRTC_ENABLE_OPENRELAY_FALLBACK: "true"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5001/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: tachfen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data: